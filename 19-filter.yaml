- name: Demo on filters
  hosts: local
  connection: local
  vars:
    topics: linux, shell, ansible, terraform #String datatype
    tagsMap:
      name: ansible
      project: roboshop
      component: catalogue
    tagsList:
      [
        { "key": "name", "value": "ansible" },
        { "key": "project", "value": "roboshop" },
        { "key": "component", "value": "catalogue" },
      ]
    course: Welcome to DevSecOps, Ansible Session
    myIP: 192.255.07.254
  tasks:
    - name: Greeting message
      ansible.builtin.debug:
        msg: "HI, Kesava {{ GREETINGS | default('World') }}"

    - name: Converting String to list
      ansible.builtin.debug:
        msg: "{{ topics.split(',') }}"

    - name: Converting map to list
      ansible.builtin.debug:
        msg: "{{ tagsMap | dict2items }}"

    - name: Converting list to map
      ansible.builtin.debug:
        msg: "{{ tagsList | items2dict }}"

    - name: read students yaml
      ansible.builtin.set_fact: # setting the variable
        student_yaml: "{{ lookup('file', 'students.yaml' ) | from_yaml }}"

    - name: convert YAML to JSON
      ansible.builtin.debug:
        msg: "{{ student_yaml | to_nice_json  }}"

    - name: Convert lower case to upper case
      ansible.builtin.debug:
        msg: "{{ course | upper }}"

    - name: Convert upper case to lower case
      ansible.builtin.debug:
        msg: "{{ course | lower }}"

    - name: Checking the IP address is correct or not
      ansible.builtin.debug:
        msg: "{{ myIP | ansible.utils.ipv4 }}"
