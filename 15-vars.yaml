- name: Ansible command VS shell modules
  hosts: local
  connection: local
  tasks:
    - name: Command module test with variables
      #ansible.builtin.command: cat /etc/passed | grep root #In command module we cannot use pipes and redirections
      ansible.builtin.shell: cat /etc/passwd | grep root
      register: users_output

    - name: Print the output
      ansible.builtin.debug:
        msg: "{{ users_output }}"

    - name: Command module test
      #ansible.builtin.command: cat /etc/passwd | grep root
      ansible.builtin.shell: ls -ltr > file.txt
      register: files_output

    - name: Print the output
      ansible.builtin.debug:
        msg: "{{ files_output }}"
